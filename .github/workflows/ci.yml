name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit in the push, not just the tip.
          fetch-depth: 0

      # The gitleaks CLI is MIT-licensed and free; only the gitleaks-action
      # wrapper requires a paid licence for organization-owned repos. Run the
      # binary directly so this needs no secret.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The suite is offline by design: every test injects fakes or a MemoryStore,
      # so no API keys or Upstash credentials are needed in CI.
      - name: Test
        run: bun run test
